services:
  fdroid-repo:
    image: nginx:alpine
    container_name: fdroid-repo
    ports:
      - "8070:80"
    volumes:
      - ./repo:/usr/share/nginx/html/repo:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/fdroid/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
