x-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  gluetun:
    logging: *bounded-logging
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: America/New_York
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"none"}'
    ports:
      - "8098:8080/tcp"
    volumes:
      - ./data/gluetun:/gluetun
      - ./wireguard.conf:/gluetun/wireguard/wg0.conf:ro
    restart: unless-stopped

  gluetun-webui:
    logging: *bounded-logging
    image: scuzza/gluetun-webui:latest
    container_name: gluetun-webui
    depends_on:
      gluetun:
        condition: service_started
    environment:
      GLUETUN_1_NAME: Gluetun
      GLUETUN_1_URL: http://gluetun:8000
      PORT: "3000"
    ports:
      - "3000:3000/tcp"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

  qbittorrent:
    logging: *bounded-logging
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_started
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - ./data/qbittorrent:/config
      - ./downloads:/downloads
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- --timeout=5 http://127.0.0.1:8080/ >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
