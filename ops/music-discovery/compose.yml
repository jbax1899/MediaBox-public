x-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  lidarr:
    logging: *bounded-logging
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
    ports:
      - "8686:8686"
    volumes:
      - ./data/lidarr:/config
      - ./data/inbox:/downloads
      - ./data/generated:/app/downloads
      - ./media:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8686/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  aurral:
    logging: *bounded-logging
    image: ghcr.io/lklynet/aurral:latest
    container_name: aurral
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
      DOWNLOAD_FOLDER: /app/downloads
      TRUST_PROXY: "false"
    ports:
      - "3002:3001"
    volumes:
      - ./data/aurral:/app/backend/data
      - ./data/generated:/app/downloads
      - ./media:/data:ro
    depends_on:
      - lidarr
    restart: unless-stopped
    healthcheck:
      # The frontend root path blocks on heavyweight bootstrap work; use the
      # lightweight liveness route instead.
      test:
        - CMD-SHELL
        - >-
          wget -qO- --timeout=5 http://127.0.0.1:3001/api/health/live >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  prowlarr:
    logging: *bounded-logging
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
    ports:
      - "9696:9696"
    volumes:
      - ./data/prowlarr:/config
    depends_on:
      - lidarr
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          (curl -fsS http://127.0.0.1:9696/ >/dev/null || wget -qO- http://127.0.0.1:9696/ >/dev/null)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
