x-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  ollama:
    logging: *bounded-logging
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/root/.ollama/models
    volumes:
      - /var/lib/ollama:/root/.ollama/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama ps >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
