services:
  webretro:
    image: nginx:alpine
    container_name: webretro
    ports:
      - "8085:80"
    volumes:
      - ./content:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
